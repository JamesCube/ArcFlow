name: Mobile approval CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile-h5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/approval-mobile/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml package
      - run: python3 examples/approval-mobile/scripts/verify-http.py
      - run: python3 examples/approval-mobile/scripts/verify-documents-http.py
      - run: npm ci
        working-directory: examples/approval-mobile
      - run: npm run typecheck && npm test && npm run build:h5
        working-directory: examples/approval-mobile
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-mobile
      - name: Install CJK sans font for bilingual procurement screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
        working-directory: examples/approval-mobile
      - name: Save synthetic mobile screenshots (no auth traces)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-h5-browser-screenshots
          path: examples/approval-mobile/test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
