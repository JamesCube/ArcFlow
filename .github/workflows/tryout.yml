name: One-command tryout
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tryout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: python3 scripts/test_tryout.py
      - run: python3 scripts/smoke-tryout.py
      - run: python3 scripts/package-tryout.py
