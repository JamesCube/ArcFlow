name: Official RuoYi integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.4
        env:
          # Disposable service-only password, never a deployed account credential.
          MYSQL_ROOT_PASSWORD: arcflow-ci-disposable
          MYSQL_DATABASE: ry-vue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parcflow-ci-disposable"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: arcflow-ci-disposable
      MYSQL_DATABASE: ry-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap immutable official upstream revisions
        run: python3 examples/ruoyi-vue3/bootstrap.py --directory "$RUNNER_TEMP/ruoyi"
      - name: Verify backend and shared approval domain
        run: |
          mvn --batch-mode --no-transfer-progress install
          mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
          mvn --batch-mode --no-transfer-progress -f "$RUNNER_TEMP/ruoyi/backend/pom.xml" package
      - name: Build official Vue 3 application with mounted ArcFlow views
        run: |
          node --test examples/ruoyi-vue3/frontend/src/views/arcflow/approval/process.test.mjs
          cd "$RUNNER_TEMP/ruoyi/frontend"
          npm ci
          npm run build:prod
      - name: Import official database and ArcFlow menu
        env:
          MYSQL_PWD: arcflow-ci-disposable
        run: |
          mysql -h 127.0.0.1 -u root ry-vue < "$RUNNER_TEMP/ruoyi/backend/sql/ry_20260417.sql"
          mysql -h 127.0.0.1 -u root ry-vue < "$RUNNER_TEMP/ruoyi/backend/sql/quartz.sql"
          mysql -h 127.0.0.1 -u root ry-vue < examples/ruoyi-vue3/sql/menu.sql
      - name: Real session, permissions, approvals and restart smoke
        run: |
          python3 -m pip install -r examples/ruoyi-vue3/tests/requirements.txt
          python3 examples/ruoyi-vue3/tests/smoke.py \
            --jar "$RUNNER_TEMP/ruoyi/backend/ruoyi-admin/target/ruoyi-admin.jar" \
            --state-directory "$RUNNER_TEMP/ruoyi-smoke"
      - name: Preserve diagnostic server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-integration-server-log
          path: ${{ runner.temp }}/ruoyi-smoke/server.log
          if-no-files-found: ignore
          retention-days: 3
