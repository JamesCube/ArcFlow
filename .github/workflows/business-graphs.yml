name: Business graph acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  business-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml package
      - name: Require new business, compatibility and restart behaviors to execute
        run: python3 scripts/verify_graph_evidence.py --domain --http
      - name: Test the fail-closed browser evidence gate
        run: |
          python3 -m unittest discover -s scripts -p 'test_graph_business_browser.py' -v
          node --test examples/approval-ui/tests/graph-business-restart.test.mjs
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install bilingual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Author and execute three real source-bound business graph journeys
        run: npm run test:e2e -- e2e/graph-business.spec.mjs --output=graph-business-results
        working-directory: examples/approval-ui
      - name: Verify durable source-bound journeys and exact-head original screenshots
        run: >-
          python3 scripts/verify_graph_business_browser.py
          --directory examples/approval-ui/graph-business-results
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --backend-jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Retain synthetic business screenshots and non-secret state receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-graph-browser-evidence
          path: |
            examples/approval-ui/graph-business-results/**/*.png
            examples/approval-ui/graph-business-results/**/*.json
          if-no-files-found: error
          retention-days: 7
