name: Approval demo CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - name: Require all scenario HTTP boundary tests, never a skipped green build
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          for suite, minimum in (('TravelScenarioApiTest', 5), ('SealUseApiTest', 10), ('ReceivingApiTest', 4), ('UnifiedScenarioApiTest', 1), ('PaymentContractApiTest', 7)):
              report = ET.parse(f'examples/approval-demo/backend/target/surefire-reports/TEST-com.arcflow.demo.{suite}.xml').getroot()
              assert int(report.attrib['tests']) >= minimum, (suite, report.attrib)
              for key in ('skipped', 'errors', 'failures'):
                  assert int(report.attrib[key]) == 0, (suite, report.attrib)
              if suite == 'UnifiedScenarioApiTest':
                  names = [case.attrib['name'] for case in report.findall('testcase')]
                  assert names.count('sixOrderedCatalogEntriesUseSeparateTypedStoresAndRejectEveryCrossHostPayload') == 1, names
              if suite == 'PaymentContractApiTest':
                  names = {case.attrib['name'] for case in report.findall('testcase')}
                  assert {'paymentFourDerivedAmountsAreExactAndNeverAcceptedAsInput',
                          'paymentAmountsDatesCurrenciesAndDeductionsRejectInvalidBoundaries',
                          'contractExactMilestonesDatesAndStandardTermsHaveDistinctValidation',
                          'bothTypesRejectMissingUnknownDuplicateForgedAndLexicallyInvalidInput',
                          'paymentAllAnyRetryAndAllRejectUseRealIndependentActors',
                          'contractSnapshotPublicationUsesNewAnyOnlyForNewRequests',
                          'authenticationCrossTypeAndWrongProcessDoNotLeakOrMutateRequests'} <= names, names
              print(suite, 'MVC boundary tests executed:', report.attrib)
          PYCODE
      - name: Verify packaged standalone dependency boundary
        run: |
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          backend = Path('examples/approval-demo/backend')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          expected = ET.parse(backend / 'pom.xml').findtext('m:parent/m:version', namespaces=ns)
          with zipfile.ZipFile(backend / 'target/approval-demo-0.1.0-SNAPSHOT.jar') as jar:
              libraries = sorted(Path(name).name for name in jar.namelist()
                                 if name.startswith('BOOT-INF/lib/') and name.endswith('.jar'))
          assert f'spring-boot-{expected}.jar' in libraries, libraries
          assert f'spring-boot-jackson2-{expected}.jar' in libraries, libraries
          assert all(name.endswith(f'-{expected}.jar') for name in libraries if name.startswith('spring-boot-')), libraries
          for family in (r'spring-(?:aop|beans|context|core|expression|web|webmvc)-(.+)\.jar',
                         r'spring-security-.+-([0-9].+)\.jar'):
              versions = {match[1] for name in libraries if (match := re.fullmatch(family, name))}
              assert len(versions) == 1 and next(iter(versions)).startswith('7.'), (family, versions)
          (backend / 'target/runtime-libraries.json').write_text(json.dumps(libraries, indent=2) + '\n')
          print('Verified Boot', expected, 'with a consistent Spring 7 / Security 7 runtime')
          PY
      - name: Retain standalone host test and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-host-reports-java-${{ matrix.java }}
          path: |
            examples/approval-demo/backend/target/surefire-reports/
            examples/approval-demo/backend/target/runtime-libraries.json
          retention-days: 7
      - name: Verify isolated CRM quote approval and member inbox separation
        run: python3 examples/crm-quote/http_smoke.py --inbox --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify isolated expense approval and schema7 restart on a live backend
        run: python3 examples/scenarios/http_smoke.py --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify isolated travel dates budget and schema8 restart on a live backend
        run: python3 examples/scenarios/travel_http_smoke.py --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify isolated non-monetary seal-use approval and schema9 restart on a live backend
        run: python3 examples/scenarios/seal_use_http_smoke.py --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify exact payment allocations and contract milestones with two real JVM restarts
        run: python3 examples/approval-demo/backend/scripts/verify-payment-contract-http.py --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify authenticated member inbox on a live disposable backend
        run: python3 examples/approval-demo/verify-parallel-http.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/approval-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify native RuoYi inbox mounted components with locked shared tools
        run: |
          native="$(cd ../ruoyi-vue3/frontend && pwd)"
          ln -s "$(pwd)/node_modules" "$native/node_modules"
          trap 'rm "$native/node_modules"' EXIT
          node node_modules/vitest/vitest.mjs run --root "$native" --config "$native/vitest.config.mjs"
      - name: Verify CRM exact amounts and isolated page recovery
        run: node --test tests/crm-quote/*.test.mjs
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml package
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install CJK sans font for bilingual visual checks
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real backend leave and procurement journeys
        run: npm run test:e2e -- --grep-invert "visual showcase:|crm quote:|gallery:|unified scenario library:|expense scenario:|travel scenario:|travel and expense:|Seal:|receiving:|complex scenarios:"
        working-directory: examples/approval-ui
      - name: Verify real CRM quote journey and capture bilingual desktop/narrow screenshots
        run: npm run test:e2e -- e2e/crm-quote.spec.mjs --output=crm-visual-results
        working-directory: examples/approval-ui
      - name: Capture bilingual leave scenarios against a fresh real backend
        run: npm run test:e2e -- --grep "visual showcase:" --output=visual-results
        working-directory: examples/approval-ui
      - name: Capture designer and complete business galleries on a fresh backend
        run: ARCFLOW_GALLERY=1 npm run test:e2e -- e2e/gallery.spec.mjs --output=gallery-results
        working-directory: examples/approval-ui
      - name: Capture the CRM rejection branch on another fresh backend
        run: ARCFLOW_GALLERY=1 GALLERY_CRM_REJECT=1 npm run test:e2e -- e2e/gallery.spec.mjs --grep "isolated CRM" --output=gallery-rejection-results
        working-directory: examples/approval-ui
      - name: Save authenticated synthetic workspace screenshots (no auth traces)
        # Capture helpers only run after successful authentication; retain partial
        # scene evidence when a later assertion fails so visual debugging is possible.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-browser-screenshots
          path: |
            examples/approval-ui/test-results/**/*.png
            examples/approval-ui/visual-results/**/*.png
            examples/approval-ui/crm-visual-results/**/*.png
            examples/approval-ui/gallery-results/**/*.png
            examples/approval-ui/gallery-rejection-results/**/*.png
          if-no-files-found: error
          retention-days: 7

  scenario-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: oa-expense
            spec: e2e/scenarios.spec.mjs
          - scenario: oa-travel
            spec: e2e/travel-scenarios.spec.mjs
          - scenario: oa-seal-use
            spec: e2e/seal-use.spec.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install bilingual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real scenario journey and capture bilingual desktop and narrow states
        env:
          ARCFLOW_CAPTURE_SCENARIOS: '1'
          ARCFLOW_CAPTURE_TRAVEL_SCENARIOS: '1'
          ARCFLOW_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:e2e -- ${{ matrix.spec }} --output=scenario-visual-results
        working-directory: examples/approval-ui
      - name: Require the complete exact-head scenario screenshot set and provenance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('examples/approval-ui/scenario-visual-results')
          scenario = os.environ['EXPECTED_SCENARIO']
          prefixes = {
              'oa-expense': ('01-catalog', '02-filled-expense', '03-designer', '04-request-detail-pending',
                             '05-review-pending', '06-review-pending', '07-request-detail-approved', '08-request-detail-rejected'),
              'oa-travel': ('travel-01-catalog', 'travel-02-filled-travel', 'travel-03-designer', 'travel-04-request-detail-pending',
                            'travel-05-review-pending', 'travel-06-review-pending', 'travel-07-review-next',
                            'travel-08-request-detail-approved', 'travel-09-request-detail-rejected', 'travel-10-validation-errors'),
              'oa-seal-use': ('01-seal-catalog', '02-seal-designer', '03-seal-form', '04-seal-validation',
                              '05-seal-pending', '06-seal-review', '07-seal-next-stage', '08-seal-approved', '09-seal-rejected'),
          }[scenario]
          expected = {f"{prefix}-{locale}-{'390' if '06-' in prefix else 'desktop'}"
                      for prefix in prefixes for locale in ('en', 'zh')}
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip(), 'Evidence requires a clean source tree'
          images = list(root.rglob('*.png'))
          assert len(images) == len(expected) and {image.stem for image in images} == expected
          sessions = set()
          for image in images:
              metadata = json.loads(image.with_suffix('.json').read_text())
              assert metadata['sourceRevision'] == head and metadata['scenario'] == scenario
              assert metadata['image'] == image.name and metadata['name'] == image.stem
              assert metadata['imageSHA256'] == hashlib.sha256(image.read_bytes()).hexdigest()
              assert metadata['captureRunId'] == os.environ['GITHUB_RUN_ID']
              assert metadata['captureRunAttempt'] == os.environ['GITHUB_RUN_ATTEMPT']
              assert metadata['captureRunUrl'] == f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              assert metadata['locale'] == ('zh' if '-zh-' in image.stem else 'en')
              narrow = image.stem.endswith('-390')
              assert metadata['viewport']['width'] == (390 if narrow else 1440)
              assert metadata['fullPage'] is (not narrow)
              assert metadata['capturedAt'] and metadata['captureSessionId']
              sessions.add(metadata['captureSessionId'])
          assert len(sessions) == 1
          print('Verified', len(images), 'authenticated scenario screenshots at', head, scenario)
          PYVERIFY
      - name: Preserve authenticated scenario screenshots and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-browser-evidence-${{ matrix.scenario }}
          path: |
            examples/approval-ui/scenario-visual-results/**/*.png
            examples/approval-ui/scenario-visual-results/**/*.json
          if-no-files-found: error
          retention-days: 7

  receiving-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install bilingual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify installed receiving client against the declared backend
        env:
          ARCFLOW_VERIFICATION_BACKEND: declared-Boot-4.1.1
        run: node scripts/verify-receiving-http.mjs ../approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
        working-directory: examples/approval-ui
      - name: Verify receiving browser journey and capture genuine bilingual screenshots
        env:
          ARCFLOW_CAPTURE_RECEIVING: '1'
          ARCFLOW_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCFLOW_VERIFICATION_BACKEND: declared-Boot-4.1.1
        run: npm run test:e2e -- e2e/receiving.spec.mjs --output=receiving-visual-results
        working-directory: examples/approval-ui
      - name: Require all fifteen exact-head receiving screenshots and completed journey
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('examples/approval-ui/receiving-visual-results')
          expected = {
              '01-form-en-desktop', '02-form-zh-desktop', '03-form-zh-390',
              '04-quantity-error-en-desktop', '05-quantity-error-zh-390',
              '06-published-any-designer-en-desktop', '07-published-any-designer-zh-390',
              '08-immutable-all-snapshot-en-desktop', '09-all-partial-bob-vote-en-desktop',
              '10-all-quality-review-zh-390', '11-bob-procurement-review-en-desktop',
              '12-all-approved-en-desktop', '13-all-rejected-zh-desktop',
              '14-any-early-advance-en-desktop', '15-any-approved-zh-390',
          }
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          expected_run = {
              'id': os.environ['GITHUB_RUN_ID'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          summaries = list(root.rglob('receiving-acceptance.json'))
          assert len(summaries) == 1, summaries
          summary = json.loads(summaries[0].read_text())
          assert summary['sourceRevision'] == head and summary['sourceTreeClean'] is True
          assert summary.get('githubRun') == expected_run, 'Receiving acceptance must belong to this workflow run and attempt'
          assert summary['verificationBackend'] == 'declared-Boot-4.1.1'
          assert summary['result'] == 'passed' and summary['capturedStates'] == 15
          assert summary['mainAndExpenseProcessesUnchanged'] is True
          assert summary['anySnapshotVersion'] == summary['allSnapshotVersion'] + 1
          images = list(root.rglob('*.png'))
          assert len(images) == 15 and {image.stem for image in images} == expected
          for image in images:
              metadata = json.loads(image.with_suffix('.json').read_text())
              assert metadata['sourceRevision'] == head and metadata['sourceTreeClean'] is True
              assert metadata.get('githubRun') == expected_run, f'Receiving image must belong to this workflow run and attempt: {image.name}'
              assert metadata['verificationBackend'] == 'declared-Boot-4.1.1'
              assert metadata['image'] == image.name and metadata['state'] == image.stem
              assert metadata['imageSHA256'] == hashlib.sha256(image.read_bytes()).hexdigest()
              assert metadata['locale'] in ('en', 'zh-CN') and metadata['fullPage'] is True
              assert metadata['viewport']['width'] == (390 if '-390' in image.stem else 1440)
          print('Verified 15 authenticated screenshots and genuine ALL/ANY receiving completion at', head)
          PYVERIFY
      - name: Preserve authenticated receiving screenshots and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiving-browser-evidence
          path: |
            examples/approval-ui/receiving-visual-results/**/*.png
            examples/approval-ui/receiving-visual-results/**/*.json
          if-no-files-found: error
          retention-days: 7

  payment-contract-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - name: Require the declared runtime before browser capture
        run: |
          python3 - <<'PYRUNTIME'
          import zipfile
          with zipfile.ZipFile('examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar') as jar:
              files = jar.namelist()
              assert 'BOOT-INF/lib/spring-boot-4.1.1.jar' in files
              assert 'BOOT-INF/lib/spring-boot-jackson2-4.1.1.jar' in files
              assert not any('/spring-boot-3.' in name for name in files)
          PYRUNTIME
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install bilingual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify installed exact-money client and workspace against the declared backend
        run: node scripts/verify-complex-http.mjs ../approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
        working-directory: examples/approval-ui
      - name: Verify both complex workflows and capture forty genuine bilingual states
        env:
          ARCFLOW_CAPTURE_COMPLEX_SCENARIOS: '1'
          ARCFLOW_BACKEND_RUNTIME: declared-Boot-4.1.1
        run: npm run test:e2e -- e2e/complex-scenarios.spec.mjs --output=complex-visual-results
        working-directory: examples/approval-ui
      - name: Require complete exact-head and exact-run payment/contract evidence
        env:
          ARCFLOW_EXPECT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCFLOW_REQUIRE_CLEAN_COMPLEX: '1'
          ARCFLOW_EXPECT_BACKEND_RUNTIME: declared-Boot-4.1.1
          ARCFLOW_EXPECT_CAPTURE_RUN_ID: ${{ github.run_id }}
          ARCFLOW_EXPECT_CAPTURE_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARCFLOW_EXPECT_CAPTURE_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-complex-captures.mjs complex-visual-results
        working-directory: examples/approval-ui
      - name: Preserve authenticated payment and contract screenshots with provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-contract-browser-evidence
          path: |
            examples/approval-ui/complex-visual-results/**/*.png
            examples/approval-ui/complex-visual-results/**/*.json
          if-no-files-found: error
          retention-days: 7
