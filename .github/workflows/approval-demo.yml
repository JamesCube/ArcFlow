name: Approval demo CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - name: Verify packaged standalone dependency boundary
        run: |
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          backend = Path('examples/approval-demo/backend')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          expected = ET.parse(backend / 'pom.xml').findtext('m:parent/m:version', namespaces=ns)
          with zipfile.ZipFile(backend / 'target/approval-demo-0.1.0-SNAPSHOT.jar') as jar:
              libraries = sorted(Path(name).name for name in jar.namelist()
                                 if name.startswith('BOOT-INF/lib/') and name.endswith('.jar'))
          assert f'spring-boot-{expected}.jar' in libraries, libraries
          assert f'spring-boot-jackson2-{expected}.jar' in libraries, libraries
          assert all(name.endswith(f'-{expected}.jar') for name in libraries if name.startswith('spring-boot-')), libraries
          for family in (r'spring-(?:aop|beans|context|core|expression|web|webmvc)-(.+)\.jar',
                         r'spring-security-.+-([0-9].+)\.jar'):
              versions = {match[1] for name in libraries if (match := re.fullmatch(family, name))}
              assert len(versions) == 1 and next(iter(versions)).startswith('7.'), (family, versions)
          (backend / 'target/runtime-libraries.json').write_text(json.dumps(libraries, indent=2) + '\n')
          print('Verified Boot', expected, 'with a consistent Spring 7 / Security 7 runtime')
          PY
      - name: Retain standalone host test and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-host-reports-java-${{ matrix.java }}
          path: |
            examples/approval-demo/backend/target/surefire-reports/
            examples/approval-demo/backend/target/runtime-libraries.json
          retention-days: 7
      - name: Verify isolated CRM quote approval and member inbox separation
        run: python3 examples/crm-quote/http_smoke.py --inbox --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify isolated expense approval and schema7 restart on a live backend
        run: python3 examples/scenarios/http_smoke.py --jar examples/approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
      - name: Verify authenticated member inbox on a live disposable backend
        run: python3 examples/approval-demo/verify-parallel-http.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/approval-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify native RuoYi inbox mounted components with locked shared tools
        run: |
          native="$(cd ../ruoyi-vue3/frontend && pwd)"
          ln -s "$(pwd)/node_modules" "$native/node_modules"
          trap 'rm "$native/node_modules"' EXIT
          node node_modules/vitest/vitest.mjs run --root "$native" --config "$native/vitest.config.mjs"
      - name: Verify CRM exact amounts and isolated page recovery
        run: node --test tests/crm-quote/*.test.mjs
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml package
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install CJK sans font for bilingual visual checks
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real backend leave and procurement journeys
        run: npm run test:e2e -- --grep-invert "visual showcase:|crm quote:|^receiving:"
        working-directory: examples/approval-ui
      - name: Verify real CRM quote journey and capture bilingual desktop/narrow screenshots
        run: npm run test:e2e -- e2e/crm-quote.spec.mjs --output=crm-visual-results
        working-directory: examples/approval-ui
      - name: Capture bilingual leave scenarios against a fresh real backend
        run: npm run test:e2e -- --grep "visual showcase:" --output=visual-results
        working-directory: examples/approval-ui
      - name: Capture designer and complete business galleries on a fresh backend
        run: ARCFLOW_GALLERY=1 npm run test:e2e -- e2e/gallery.spec.mjs --output=gallery-results
        working-directory: examples/approval-ui
      - name: Capture expense designer form pending approved and rejected states
        run: ARCFLOW_CAPTURE_SCENARIOS=1 npm run test:e2e -- e2e/scenarios.spec.mjs --output=scenario-visual-results
        working-directory: examples/approval-ui
      - name: Capture the CRM rejection branch on another fresh backend
        run: ARCFLOW_GALLERY=1 GALLERY_CRM_REJECT=1 npm run test:e2e -- e2e/gallery.spec.mjs --grep "isolated CRM" --output=gallery-rejection-results
        working-directory: examples/approval-ui
      - name: Save authenticated synthetic workspace screenshots (no auth traces)
        # Capture helpers only run after successful authentication; retain partial
        # scene evidence when a later assertion fails so visual debugging is possible.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-browser-screenshots
          path: |
            examples/approval-ui/test-results/**/*.png
            examples/approval-ui/visual-results/**/*.png
            examples/approval-ui/crm-visual-results/**/*.png
            examples/approval-ui/gallery-results/**/*.png
            examples/approval-ui/gallery-rejection-results/**/*.png
            examples/approval-ui/scenario-visual-results/**/*.png
            examples/approval-ui/scenario-visual-results/**/*.json
          if-no-files-found: error
          retention-days: 7

  receiving-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - name: Install bilingual fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify installed receiving client against the declared backend
        env:
          ARCFLOW_VERIFICATION_BACKEND: declared-Boot-4.1.1
        run: node scripts/verify-receiving-http.mjs ../approval-demo/backend/target/approval-demo-0.1.0-SNAPSHOT.jar
        working-directory: examples/approval-ui
      - name: Verify receiving browser journey and capture genuine bilingual screenshots
        env:
          ARCFLOW_CAPTURE_RECEIVING: '1'
          ARCFLOW_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCFLOW_VERIFICATION_BACKEND: declared-Boot-4.1.1
        run: npm run test:e2e -- e2e/receiving.spec.mjs --output=receiving-visual-results
        working-directory: examples/approval-ui
      - name: Require all fifteen exact-head receiving screenshots and completed journey
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('examples/approval-ui/receiving-visual-results')
          expected = {
              '01-form-en-desktop', '02-form-zh-desktop', '03-form-zh-390',
              '04-quantity-error-en-desktop', '05-quantity-error-zh-390',
              '06-published-any-designer-en-desktop', '07-published-any-designer-zh-390',
              '08-immutable-all-snapshot-en-desktop', '09-all-partial-bob-vote-en-desktop',
              '10-all-quality-review-zh-390', '11-bob-procurement-review-en-desktop',
              '12-all-approved-en-desktop', '13-all-rejected-zh-desktop',
              '14-any-early-advance-en-desktop', '15-any-approved-zh-390',
          }
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          summaries = list(root.rglob('receiving-acceptance.json'))
          assert len(summaries) == 1, summaries
          summary = json.loads(summaries[0].read_text())
          assert summary['sourceRevision'] == head and summary['sourceTreeClean'] is True
          assert summary['verificationBackend'] == 'declared-Boot-4.1.1'
          assert summary['result'] == 'passed' and summary['capturedStates'] == 15
          assert summary['mainAndExpenseProcessesUnchanged'] is True
          assert summary['anySnapshotVersion'] == summary['allSnapshotVersion'] + 1
          images = list(root.rglob('*.png'))
          assert len(images) == 15 and {image.stem for image in images} == expected
          for image in images:
              metadata = json.loads(image.with_suffix('.json').read_text())
              assert metadata['sourceRevision'] == head and metadata['sourceTreeClean'] is True
              assert metadata['verificationBackend'] == 'declared-Boot-4.1.1'
              assert metadata['image'] == image.name and metadata['state'] == image.stem
              assert metadata['imageSHA256'] == hashlib.sha256(image.read_bytes()).hexdigest()
              assert metadata['locale'] in ('en', 'zh-CN') and metadata['fullPage'] is True
              assert metadata['viewport']['width'] == (390 if '-390' in image.stem else 1440)
          print('Verified 15 authenticated screenshots and genuine ALL/ANY receiving completion at', head)
          PYVERIFY
      - name: Preserve authenticated receiving screenshots and provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiving-browser-evidence
          path: |
            examples/approval-ui/receiving-visual-results/**/*.png
            examples/approval-ui/receiving-visual-results/**/*.json
          if-no-files-found: error
          retention-days: 7
