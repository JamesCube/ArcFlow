name: Approval demo CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/approval-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/approval-ui/package-lock.json
      - run: mvn --batch-mode --no-transfer-progress install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-domain/pom.xml install
      - run: mvn --batch-mode --no-transfer-progress -f examples/approval-demo/backend/pom.xml package
      - run: npm ci
        working-directory: examples/approval-ui
      - run: npx playwright install --with-deps chromium
        working-directory: examples/approval-ui
      - run: npm run test:e2e
        working-directory: examples/approval-ui
      - name: Save synthetic workspace screenshots (no auth traces)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-browser-screenshots
          path: examples/approval-ui/test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
