# Opt in using --spring.profiles.active=druid,arcflow.
# No password/token defaults. Supply your own disposable development credentials.
server:
  address: ${ARCFLOW_BIND_ADDRESS:127.0.0.1}
ruoyi:
  profile: ${RUOYI_UPLOAD_PATH:./data/uploads}
spring:
  datasource:
    druid:
      master:
        url: ${ARCFLOW_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ry-vue?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASSWORD}
      statViewServlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
token:
  secret: ${TOKEN_SECRET}
arcflow:
  data-file: ${ARCFLOW_DATA_FILE:./data/arcflow-approvals.json}
  initial-approver-id: ${ARCFLOW_INITIAL_APPROVER_ID:101}
