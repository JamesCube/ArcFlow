server.address=127.0.0.1
server.port=8080
server.error.include-message=never
spring.jackson2.deserialization.fail-on-unknown-properties=true
approval.data-file=${APPROVAL_DATA_FILE:./data/requests.json}
approval.ui-origin=${APPROVAL_UI_ORIGIN:http://localhost:5173}
spring.jackson2.deserialization.accept-float-as-int=false

# Keep HTTP and persistence on the same strict shared-domain mapper during migration.
spring.http.converters.preferred-json-mapper=jackson2
